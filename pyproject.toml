[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "grant-merriel-video-safezone"
dynamic = ["version"]
description = "Grant Merriel's video safe-zone checker: finds text and faces in 9:16 and 4:5 ads that sit under Instagram, Facebook or YouTube Shorts buttons, or get cut off in the 4:5 Feed crop."
readme = "README.md"
license = "MIT"
authors = [{ name = "Grant Merriel" }]
requires-python = ">=3.10"
keywords = ["video", "safe zone", "reels", "shorts", "instagram", "facebook", "youtube", "ads", "captions"]
dependencies = [
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
  "rapidocr-onnxruntime>=1.3; sys_platform != 'darwin'",
  "opencv-python-headless>=4.8; sys_platform != 'darwin'",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
safezone = "safezone.cli:main"
grant-merriel-video-safezone = "safezone.cli:main"

[project.urls]
Homepage = "https://github.com/the-agency-os/grant-merriel-video-safezone"

[tool.hatch.version]
path = "src/safezone/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/safezone"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
