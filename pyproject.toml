[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "grant-merriel-video-checker"
dynamic = ["version"]
description = "Grant Merriel's video checker for 9:16 and 4:5 ads: text and faces under Instagram, Facebook or YouTube Shorts buttons or cut by the 4:5 crop, captions vs what's said, spec and sound, hook and readability."
readme = "README.md"
license = "MIT"
authors = [{ name = "Grant Merriel" }]
requires-python = ">=3.10"
keywords = ["video", "safe zone", "reels", "shorts", "instagram", "facebook", "youtube", "ads", "captions"]
dependencies = [
  "pillow>=10",
  "imageio-ffmpeg>=0.5",
  "numpy>=1.24",
  "faster-whisper>=1.0",
  "rapidocr-onnxruntime>=1.3; sys_platform != 'darwin'",
  "opencv-python-headless>=4.8; sys_platform != 'darwin'",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
video-checker = "video_checker.cli:main"
grant-merriel-video-video-checker = "video_checker.cli:main"

[project.urls]
Homepage = "https://github.com/the-agency-os/grant-merriel-video-checker"

[tool.hatch.version]
path = "src/video_checker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/video_checker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
